<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c3ce0">
  <title>外送系統</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <!-- 圖示（Lucide 風格線條圖示，內嵌避免外部資源）；以 <use href="#i-名稱"> 引用 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
    <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  </svg>

  <header class="topbar">
    <button id="back" class="icon-btn" type="button" aria-label="返回" hidden><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
    <div class="brand"><span class="brand-mark"><svg class="icon icon-fill" aria-hidden="true"><use href="#i-zap"/></svg></span>外送系統</div>
    <button id="debug-toggle" class="debug-toggle" type="button" aria-expanded="false" aria-controls="dashboard"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg>Debug</button>
  </header>

  <div class="layout">
    <main class="screens">
      <!-- 首頁：店家列表 -->
      <section id="screen-home" class="screen">
        <h1 class="section-title">附近餐廳</h1>
        <!-- 載入前先放骨架卡片，避免畫面空白與版面跳動 -->
        <div id="restaurants" class="restaurant-list" aria-busy="true">
          <div class="restaurant-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="body"><span></span><span></span></div></div>
          <div class="restaurant-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="body"><span></span><span></span></div></div>
          <div class="restaurant-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="body"><span></span><span></span></div></div>
        </div>
        <p id="load-error" class="error-text" hidden></p>
      </section>

      <!-- 店家頁：菜單 -->
      <section id="screen-restaurant" class="screen" hidden>
        <div id="r-cover" class="cover" aria-hidden="true"></div>
        <div class="r-info">
          <h1 id="r-name"></h1>
          <p id="r-meta" class="muted"></p>
        </div>
        <h2 class="section-title">菜單</h2>
        <ul id="menu" class="menu"></ul>
        <div id="cart-bar" class="bottom-bar" hidden>
          <button id="view-cart" class="cart-button" type="button">
            <span class="cart-icon"><svg class="icon" aria-hidden="true"><use href="#i-bag"/></svg><span id="cart-count" class="badge">0</span></span>
            <span>查看購物車</span>
            <span id="cart-total">NT$ 0</span>
          </button>
        </div>
      </section>

      <!-- 結帳頁 -->
      <section id="screen-checkout" class="screen" hidden>
        <h1 class="page-title">結帳</h1>
        <div class="card">
          <h2>外送資料</h2>
          <p class="muted">全部選填。地址留空時，系統會隨機指定一個位置。</p>
          <form id="customer-form" class="customer" autocomplete="off">
            <label>地址<input name="address" maxlength="100" placeholder="例如：大學路 1 號"></label>
            <details class="more-fields">
              <summary><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>姓名、電話、備註</summary>
              <label>姓名<input name="name" maxlength="40"></label>
              <label>電話<input name="phone" type="tel" inputmode="tel" maxlength="20"></label>
              <label>給外送夥伴的備註<input name="note" maxlength="100"></label>
            </details>
          </form>
        </div>
        <div class="card">
          <h2>訂單明細</h2>
          <p id="co-restaurant" class="muted"></p>
          <ul id="co-lines" class="lines"></ul>
          <div class="sum-row"><span>外送費</span><span>免費</span></div>
          <div class="sum-row total"><span>總計</span><span id="co-total">NT$ 0</span></div>
        </div>
        <div class="bottom-bar">
          <button id="place-order" class="primary wide" type="button">下訂單</button>
        </div>
      </section>

      <!-- 追蹤頁：兩個版本各一個完整追蹤區塊 -->
      <section id="screen-tracking" class="screen" hidden>
        <h1 class="visually-hidden">配送追蹤</h1>
        <div id="tracks"></div>
        <div class="card order-detail">
          <h2>訂單詳情</h2>
          <div class="detail-row"><span class="muted">訂單配送來自</span><span id="od-restaurant"></span></div>
          <div class="detail-row"><span class="muted">送餐地址</span><span id="od-address"></span></div>
          <ul id="od-lines" class="lines"></ul>
          <div class="sum-row total"><span>總計</span><span id="od-total"></span></div>
        </div>
        <div class="bottom-bar">
          <button id="again" class="primary wide" type="button" disabled>派單中…</button>
        </div>
      </section>
    </main>

    <aside id="dashboard" class="dashboard" hidden aria-label="Debug 儀表板">
      <div class="dash-head">
        <h2>Debug</h2>
        <span id="dash-status" class="muted">連線中…</span>
      </div>
      <!-- 左右兩欄對齊下方的兩個追蹤區塊，像兩台模擬器並排 -->
      <div class="dash-targets">
        <article class="dash-target" data-target="fixed">
          <h3><span class="swatch swatch-fixed"></span>固定版</h3>
          <dl class="stats"></dl>
        </article>
        <article class="dash-target" data-target="auto">
          <h3><span class="swatch swatch-auto"></span>擴展版</h3>
          <dl class="stats"></dl>
        </article>
      </div>
      <details id="dash-charts" class="dash-charts">
        <summary>趨勢圖（最近 10 分鐘）</summary>
        <div class="charts">
          <figure class="chart" data-metric="success_rate">
            <figcaption>成功率</figcaption>
            <div class="legend"></div>
            <svg class="chart-svg" role="img" aria-label="成功率趨勢"></svg>
            <div class="tooltip" hidden></div>
          </figure>
          <figure class="chart" data-metric="avg_ms">
            <figcaption title="每 10 秒，下單與外送員位置更新的每一筆請求，從送出到收到回應的平均時間；逾時以 10 秒計，忙碌與錯誤不計入">平均回應時間</figcaption>
            <div class="legend"></div>
            <svg class="chart-svg" role="img" aria-label="平均回應時間趨勢"></svg>
            <div class="tooltip" hidden></div>
          </figure>
        </div>
      </details>
    </aside>
  </div>

  <!-- 懸浮球：離開追蹤頁後訂單仍在追蹤，點一下回到追蹤頁 -->
  <button id="order-fab" class="order-fab" type="button" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-bike"/></svg>
    <span class="fab-label" aria-hidden="true"></span>
  </button>

  <template id="track-template">
    <article class="track">
      <header class="track-head"><span class="swatch"></span><span class="track-title"></span><span class="tag"></span></header>
      <div class="track-map"><svg class="map" role="img" aria-label="外送地圖"></svg></div>
      <div class="track-body">
        <p class="eta-label">預估外送時間</p>
        <p class="eta"></p>
        <div class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="status-text" role="status"></p>
        <p class="track-meta muted"></p>
      </div>
      <div class="rider-card" hidden>
        <!-- 外送員大頭貼：亂翹頭髮的毛頭小子插圖 -->
        <svg class="avatar" viewBox="0 0 48 48" role="img" aria-label="外送員大頭貼">
          <circle cx="24" cy="24" r="24" fill="var(--brand-soft)"/>
          <path d="M10 48c1-9 7-13 14-13s13 4 14 13z" fill="var(--brand)"/>
          <circle cx="24" cy="24" r="10.5" fill="#f6c9a0"/>
          <circle cx="13.6" cy="25" r="2.4" fill="#f6c9a0"/>
          <circle cx="34.4" cy="25" r="2.4" fill="#f6c9a0"/>
          <path d="M13 22c-1-7 3-12 8-13l-1-4 4 3 2-5 2 5 4-3-1 5c4 2 6 6 5 12-2-3-4-5-7-5-1 2-4 3-7 2l1 2c-4 0-7 0-10 1z" fill="#3b2a20"/>
          <circle cx="20" cy="25" r="1.4" fill="#2b2b2b"/>
          <circle cx="28" cy="25" r="1.4" fill="#2b2b2b"/>
          <path d="M20.5 29.5q3.5 3 7 0" fill="none" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="17.5" cy="28.5" r="1.6" fill="#f29a8a" opacity=".6"/>
          <circle cx="30.5" cy="28.5" r="1.6" fill="#f29a8a" opacity=".6"/>
        </svg>
        <div><strong class="rider-name"></strong><span class="muted">你的外送夥伴</span></div>
      </div>
    </article>
  </template>
</body>
</html>
